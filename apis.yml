name: The Clearing House (RTP)
kind: company
description: >-
  The Clearing House (TCH) is a U.S. banking association and payments company
  owned by many of the largest commercial banks. It operates three core payment
  systems: CHIPS (large-value wire clearing), the EPN automated clearing house
  (ACH), and the RTP network, the private-sector real-time payments rail it
  launched in 2017 as the first new U.S. payments infrastructure in decades. RTP
  is a 24/7/365 instant-payments scheme built on the ISO 20022 messaging
  standard, supporting immediate credit-push transfers up to $10 million with
  final settlement, plus Request for Payment (RfP), remittance data, and a UID
  addressing/directory lookup. TCH is the scheme operator for the U.S. market
  and competes with the Federal Reserve's FedNow service. Its API posture is
  documentation- and rulebook-first: TCH does not publish an open, self-serve
  public REST API or downloadable OpenAPI/Swagger specification. Instead it
  publishes ISO 20022 message specifications (pacs, pain, camt, remt) as PDFs,
  the RTP network operating rules, playbooks, and a technology-provider program.
  Real-time HTTP/JSON RTP APIs are surfaced to businesses by participating
  financial institutions (for example U.S. Bank) and registered technology
  providers that connect to the RTP network on their behalf.
