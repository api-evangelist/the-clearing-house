apis:
- aid: the-clearing-house:rtp-network
  name: RTP Network (ISO 20022 Messaging)
  description: >-
    The RTP network is The Clearing House's real-time payments scheme for the
    United States, moving credit-push payments instantly, 24/7/365, with final
    settlement up to $10 million per transaction. It is defined by published
    ISO 20022 message specifications rather than an open self-serve REST API:
    Credit Transfer (pacs.008), Message Status Report (pacs.002), Request for
    Payment (pain.013/pain.014), Request for Information (camt.026/camt.028),
    Request for Return of Funds (camt.056/camt.029), Payment Acknowledgement
    (camt.035), Stand-Alone Remittance Advice (remt.001), and the Business
    Application Header (BAH). Access is via participating financial institutions
    and registered technology providers; no downloadable OpenAPI is published by
    TCH.
  humanURL: https://www.theclearinghouse.org/payment-systems/rtp/technical-documentation
