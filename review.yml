actions:
  status: built-stub
  reason: >-
    Honest identity + docs-pointer record for a documentation/rulebook-first
    U.S. real-time payments scheme operator. No public self-serve API, no
    developer portal, and no downloadable OpenAPI to harvest; the openapi/
    directory is intentionally empty.
